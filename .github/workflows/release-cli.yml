      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: artifacts/bundle
      - name: Reinspect downloaded publication inputs for private data
        shell: bash
        run: python3 -B tools/privacy/check.py --metadata --github-hosted --output artifacts/bundle
      - name: Revalidate the remote tag before publishing packages
        shell: bash
        run: >-
          bash tools/release/assert-release-tag.sh --tag "$GITHUB_REF_NAME"
          --expected-commit '${{ needs.validate-tag.outputs.commit }}'
      - name: Reverify the bundle at the protected publication boundary
        shell: bash
        run: |
          bash tools/release/verify-release-bundle.sh \
