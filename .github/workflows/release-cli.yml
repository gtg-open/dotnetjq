            --artifacts artifacts/bundle \
            --package-id dotnetjq \
            --library-package-id DotNetJq.Library \
            --proof artifacts/bundle/aot-relink-proof.txt \
            --proof-rid linux-x64 \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --authors "$RELEASE_AUTHORS" \
            --publisher "$WINGET_PUBLISHER" \
            --winget-package-id "$WINGET_PACKAGE_ID"
      - name: Regenerate the deterministic release body
        shell: bash
        run: >-
          bash tools/release/generate-release-notes.sh
          --version '${{ needs.validate-tag.outputs.version }}'
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --output "$RUNNER_TEMP/dotnetjq-release-notes.md"
      - name: Inspect the exact release body before publication
        shell: bash
        run: python3 -B tools/privacy/check.py --metadata --github-hosted --output "$RUNNER_TEMP/dotnetjq-release-notes.md"
      - name: Reclassify and verify the release immediately before publication
        id: protected-release-state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/release/probe-github-release.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --name 'DotNetJq ${{ needs.validate-tag.outputs.version }} — jq 1.8.2 compatible'
          --body-file "$RUNNER_TEMP/dotnetjq-release-notes.md"
          --artifacts artifacts/bundle
          --prerelease '${{ needs.validate-tag.outputs.prerelease }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Reject any incomplete staged release at the protected boundary
        if: >-
          steps.protected-release-state.outputs.state != 'exact-draft' &&
          steps.protected-release-state.outputs.state != 'published'
        shell: bash
        run: |
          echo 'The GitHub release is not an exact draft or exact published release at the protected boundary.' >&2
          exit 1
      - name: Require GitHub release immutability before package publication
        shell: bash
        env:
          RELEASE_SETTINGS_GITHUB_TOKEN: ${{ secrets.RELEASE_SETTINGS_GITHUB_TOKEN }}
        run: |
          [ -n "$RELEASE_SETTINGS_GITHUB_TOKEN" ] || {
            echo 'RELEASE_SETTINGS_GITHUB_TOKEN is required to verify immutable releases.' >&2
            exit 1
          }
          response="$RUNNER_TEMP/immutable-releases.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $RELEASE_SETTINGS_GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases" \
            --output "$response"
          python3 - "$response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              settings = json.load(stream)
          if settings.get("enabled") is not True:
              raise SystemExit("GitHub release immutability is not enabled")
          PY
      - name: Create a least-privilege Homebrew preflight token
        if: >-
          needs.validate-tag.outputs.prerelease == 'false' &&
          steps.protected-release-state.outputs.superseded == 'false'
        id: homebrew-preflight-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ vars.HOMEBREW_TAP_OWNER }}
          repositories: ${{ vars.HOMEBREW_TAP_NAME }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify stable package-manager credentials before core publication
        if: >-
          needs.validate-tag.outputs.prerelease == 'false' &&
          steps.protected-release-state.outputs.superseded == 'false'
        shell: bash
        env:
          HOMEBREW_TOKEN: ${{ steps.homebrew-preflight-token.outputs.token }}
          HOMEBREW_TAP_OWNER: ${{ vars.HOMEBREW_TAP_OWNER }}
          HOMEBREW_TAP_NAME: ${{ vars.HOMEBREW_TAP_NAME }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_OWNER" ] && [ -n "$HOMEBREW_TAP_NAME" ] || {
            echo 'The Homebrew tap owner and repository variables are required.' >&2
            exit 1
          }
          [ -n "$WINGET_CREATE_GITHUB_TOKEN" ] || {
            echo 'WINGET_CREATE_GITHUB_TOKEN is required for a stable release.' >&2
            exit 1
          }
          response="$RUNNER_TEMP/homebrew-tap.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $HOMEBREW_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$HOMEBREW_TAP_OWNER/$HOMEBREW_TAP_NAME" \
            --output "$response"
          python3 - "$response" "$HOMEBREW_TAP_OWNER/$HOMEBREW_TAP_NAME" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              repository = json.load(stream)
          if repository.get("full_name", "").casefold() != sys.argv[2].casefold():
              raise SystemExit("Homebrew App token resolved an unexpected repository")
          if not repository.get("permissions", {}).get("push"):
              raise SystemExit("Homebrew App token does not have Contents write access")
          PY
          headers="$RUNNER_TEMP/winget-token.headers"
          response="$RUNNER_TEMP/winget-token.json"
          curl --fail --silent --show-error \
            --dump-header "$headers" \
            --header "Authorization: Bearer $WINGET_CREATE_GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/user" \
            --output "$response"
          python3 - "$response" "$headers" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              user = json.load(stream)
          if user.get("login", "").casefold() != "gtg-open-maintainer":
              raise SystemExit("WinGet token belongs to an unexpected GitHub account")
          with open(sys.argv[2], encoding="iso-8859-1") as stream:
              scope_lines = [
                  line.split(":", 1)[1].strip()
                  for line in stream
                  if line.casefold().startswith("x-oauth-scopes:")
              ]
          if len(scope_lines) != 1:
              raise SystemExit("WinGet token response has no unique OAuth scope header")
          scopes = {value.strip() for value in scope_lines[0].split(",") if value.strip()}
          if scopes != {"public_repo"}:
              raise SystemExit(
                  "WinGet token must grant exactly public_repo and no broader scope"
              )
          PY
      - name: Request a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish or safely resume the verified NuGet plan
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          bash tools/release/publish-nuget-plan.sh
          --directory artifacts/bundle
          --expected-owner "$NUGET_OWNER"
      - name: Publish the already populated draft
        if: steps.protected-release-state.outputs.state == 'exact-draft'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DotNetJq ${{ needs.validate-tag.outputs.version }} — jq 1.8.2 compatible
          body_path: ${{ runner.temp }}/dotnetjq-release-notes.md
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: >-
            ${{ needs.validate-tag.outputs.prerelease == 'false' &&
                steps.protected-release-state.outputs.superseded == 'false' }}
          overwrite_files: false
      - name: Verify the published release retained every exact asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/release/verify-github-release-assets.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --name 'DotNetJq ${{ needs.validate-tag.outputs.version }} — jq 1.8.2 compatible'
          --body-file "$RUNNER_TEMP/dotnetjq-release-notes.md"
          --artifacts artifacts/bundle
          --state published
          --prerelease '${{ needs.validate-tag.outputs.prerelease }}'

  homebrew:
    name: Open the Homebrew tap update
    if: >-
      needs.validate-tag.outputs.prerelease == 'false' &&
      needs.publish-core.outputs.superseded == 'false'
    needs:
      - validate-tag
      - publish-core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Inspect source and reachable history for private data
        id: privacy-source
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --history
      - name: Create a least-privilege tap token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ vars.HOMEBREW_TAP_OWNER }}
          repositories: ${{ vars.HOMEBREW_TAP_NAME }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_OWNER }}/${{ vars.HOMEBREW_TAP_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: artifacts/bundle
      - name: Reinspect downloaded publication inputs for private data
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --metadata --github-hosted --output artifacts/bundle
      - name: Classify the current tap formula without allowing a downgrade
        id: homebrew-formula
        shell: bash
        run: |
          state=$(python3 source/tools/release/classify-homebrew-formula.py \
            --current tap/Formula/dotnetjq.rb \
            --candidate artifacts/bundle/dotnetjq.rb \
            --version '${{ needs.validate-tag.outputs.version }}')
          echo "state=$state" >>"$GITHUB_OUTPUT"
      - name: Stage the verified formula
        if: startsWith(steps.homebrew-formula.outputs.state, 'publish:')
        shell: bash
        run: |
          mkdir -p tap/Formula
          cp artifacts/bundle/dotnetjq.rb tap/Formula/dotnetjq.rb
      - name: Inspect the exact staged Homebrew formula
        if: startsWith(steps.homebrew-formula.outputs.state, 'publish:')
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --metadata --github-hosted --output tap/Formula/dotnetjq.rb
      - name: Revalidate the release tag before opening the tap pull request
        shell: bash
        working-directory: source
        run: >-
          bash tools/release/assert-release-tag.sh --tag "$GITHUB_REF_NAME"
          --expected-commit '${{ needs.validate-tag.outputs.commit }}'
      - name: Open a reviewable tap pull request
        if: startsWith(steps.homebrew-formula.outputs.state, 'publish:')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          branch: release/dotnetjq-${{ needs.validate-tag.outputs.version }}
          delete-branch: true
          commit-message: Update dotnetjq to ${{ needs.validate-tag.outputs.version }}
          title: Update dotnetjq to ${{ needs.validate-tag.outputs.version }}
          body: Generated from the verified DotNetJq ${{ needs.validate-tag.outputs.version }} release bundle.
      - name: Report an already current or superseded tap formula
        if: startsWith(steps.homebrew-formula.outputs.state, 'skip:')
        shell: bash
        run: echo "Homebrew formula state is ${{ steps.homebrew-formula.outputs.state }}; no pull request is needed."

  winget:
    name: Submit the WinGet manifests
    if: >-
      needs.validate-tag.outputs.prerelease == 'false' &&
      needs.publish-core.outputs.superseded == 'false'
    needs:
      - validate-tag
      - publish-core
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Inspect source and reachable history for private data
        id: privacy-source
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --history
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: artifacts/bundle
      - name: Reinspect downloaded publication inputs for private data
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --metadata --github-hosted --output artifacts/bundle
      - name: Prepare the exact stable manifests
        shell: pwsh
        run: |
          bash source/tools/release/assert-release-tag.sh `
            --tag "$env:GITHUB_REF_NAME" `
            --expected-commit '${{ needs.validate-tag.outputs.commit }}'
          New-Item -ItemType Directory -Path artifacts/winget | Out-Null
          Copy-Item artifacts/bundle/GtGOpen.DotNetJq*.yaml artifacts/winget/
      - name: Inspect the exact WinGet submission files
        shell: bash
        run: python3 -B source/tools/privacy/check.py --repo source --metadata --github-hosted --output artifacts/winget
      - name: Classify an existing exact WinGet submission
        id: winget-pr
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          python source/tools/release/probe-winget-pull-request.py `
            --package-id "$env:WINGET_PACKAGE_ID" `
            --version '${{ needs.validate-tag.outputs.version }}' `
            --manifests artifacts/winget `
            --pr-title 'DotNetJq ${{ needs.validate-tag.outputs.version }}' `
            --github-output "$env:GITHUB_OUTPUT"
      - name: Download and verify WingetCreate 1.12.13.0
        if: steps.winget-pr.outputs.state == 'missing'
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe'
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash .\wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'
          if ($actual -ne $expected) {
            throw "WingetCreate checksum mismatch: $actual"
          }
      - name: Submit the exact stable manifests
        if: steps.winget-pr.outputs.state == 'missing'
        id: submit-winget
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $submissionOutput = @(.\wingetcreate.exe submit `
            --prtitle "DotNetJq ${{ needs.validate-tag.outputs.version }}" `
            --no-open `
            artifacts/winget 2>&1)
          $submissionExitCode = $LASTEXITCODE
          $submissionOutput | Write-Output
          if ($submissionExitCode -ne 0) {
            throw "WingetCreate exited with status $submissionExitCode"
          }
          $numbers = @(
            [regex]::Matches(
              ($submissionOutput -join "`n"),
              'https://github\.com/microsoft/winget-pkgs/pull/([1-9][0-9]*)'
            ) | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          )
          if ($numbers.Count -ne 1) {
            throw 'WingetCreate did not report exactly one WinGet pull-request URL.'
          }
          "pull_request_number=$($numbers[0])" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify the submitted WinGet pull request by its exact identity
        if: steps.winget-pr.outputs.state == 'missing'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $verified = $false
          foreach ($attempt in 1..12) {
            python source/tools/release/probe-winget-pull-request.py `
              --package-id "$env:WINGET_PACKAGE_ID" `
              --version '${{ needs.validate-tag.outputs.version }}' `
              --manifests artifacts/winget `
              --pr-title 'DotNetJq ${{ needs.validate-tag.outputs.version }}' `
              --pull-request-number '${{ steps.submit-winget.outputs.pull_request_number }}'
            if ($LASTEXITCODE -eq 0) {
              $verified = $true
              break
            }
            if ($attempt -lt 12) { Start-Sleep -Seconds 5 }
          }
          if (-not $verified) {
            throw 'Submitted WinGet pull request did not become exactly verifiable.'
          }
      - name: Report the already verified WinGet pull request
        if: steps.winget-pr.outputs.state == 'exact-existing'
        shell: pwsh
        run: >-
          Write-Host
          'Exact WinGet submission already exists:'
          '${{ steps.winget-pr.outputs.pull_request_url }}'
      - name: Report the already published WinGet version
        if: steps.winget-pr.outputs.state == 'exact-published'
        shell: pwsh
        run: >-
          Write-Host
          'Exact WinGet manifests are already published; no submission is needed.'
