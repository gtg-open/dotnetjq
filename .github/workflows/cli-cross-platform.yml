name: CLI cross-platform verification

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNETJQ_REQUIRE_FULL_COMPATIBILITY: 1
  CLI_PROJECT: src/DotNetJq.Cli/DotNetJq.Cli.csproj
  CLI_TEST_PROJECT: tests/DotNetJq.Cli.Tests/DotNetJq.Cli.Tests.csproj
  CI_VERSION: 0.0.0-ci
  # .NET SDK 10.0.400, Alpine 3.24 AOT multi-architecture manifest.
  ALPINE_AOT_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:cd255a72d14d70260bb9b8dc493c3c37ce0877ef534f85ac1c931628364d7059
  # .NET runtime-deps 10.0.11, Alpine 3.24 multi-architecture manifest.
  ALPINE_RUNTIME_DEPS_IMAGE: mcr.microsoft.com/dotnet/runtime-deps@sha256:379b17d7d388a2a1b5330bfc2429a01091f85e255d3bce7981d65927d786c000

jobs:
  managed-cli:
    name: Managed CLI (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: win-x64
            os: windows-2025
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Provision exact jq source and official oracle
        shell: bash
        run: >-
          bash tools/release/provision-jq-1.8.2-test-assets.sh
          --rid '${{ matrix.rid }}'
          --destination "$GITHUB_WORKSPACE/artifacts/test-assets/jq-1.8.2"
          --github-env "$GITHUB_ENV"
      - name: Restore and build managed CLI process suite
        shell: bash
        run: |
          dotnet restore "$CLI_TEST_PROJECT"
          dotnet build "$CLI_TEST_PROJECT" --configuration Release --no-restore \
            -p:Version="$CI_VERSION" -p:PackageVersion="$CI_VERSION"
          dotnet publish "$CLI_PROJECT" \
            --configuration Release --no-restore --self-contained false \
            -p:PublishAot=false -p:UseAppHost=true \
            -p:Version="$CI_VERSION" -p:PackageVersion="$CI_VERSION" \
            --output 'artifacts/managed-cli/${{ matrix.rid }}'
      - name: Select the framework-dependent CLI subject
        shell: bash
        run: |
          case '${{ matrix.rid }}' in
            win-*) subject="$PWD/artifacts/managed-cli/${{ matrix.rid }}/DotNetJq.Cli.exe" ;;
            *) subject="$PWD/artifacts/managed-cli/${{ matrix.rid }}/DotNetJq.Cli" ;;
          esac
          test -f "$subject"
          if command -v cygpath >/dev/null 2>&1; then subject=$(cygpath -aw -- "$subject"); fi
          printf 'DOTNETJQ_CLI=%s\n' "$subject" >>"$GITHUB_ENV"
      - name: Run the complete strict managed CLI process suite
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          dotnet test "$CLI_TEST_PROJECT" \
            --configuration Release --no-build --no-restore \
            --results-directory artifacts/test-results \
            --logger 'trx;LogFileName=managed-${{ matrix.rid }}.trx'
          python tools/release/verify-trx-no-skips.py \
            'artifacts/test-results/managed-${{ matrix.rid }}.trx'
      - name: Run Unix shell and byte contract
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/cli-shell/verify.sh "$DOTNETJQ_CLI" "$CI_VERSION"
      - name: Run Windows PowerShell 7 contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./tests/powershell/Verify-DotNetJq.ps1
          -CliPath $env:DOTNETJQ_CLI
          -ExpectedShell PowerShell7
          -ExpectedVersion $env:CI_VERSION

  powershell:
    name: Managed CLI (${{ matrix.shell.name }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell:
          - name: PowerShell 7
            executable: pwsh
            expected: PowerShell7
          - name: Windows PowerShell 5.1
            executable: powershell.exe
            expected: WindowsPowerShell51
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build framework-dependent Windows CLI
        run: >-
          dotnet build ${{ env.CLI_PROJECT }}
          --configuration Release
          -p:Version='${{ env.CI_VERSION }}'
      - name: Verify invocation, pipelines, paths, bytes, and exit codes
        shell: pwsh
        run: >-
          & '${{ matrix.shell.executable }}'
          -NoLogo
          -NoProfile
          -NonInteractive
          -ExecutionPolicy Bypass
          -File tests/powershell/Verify-DotNetJq.ps1
          -CliPath src/DotNetJq.Cli/bin/Release/net10.0/DotNetJq.Cli.exe
          -ExpectedShell '${{ matrix.shell.expected }}'
          -ExpectedVersion '${{ env.CI_VERSION }}'

  native-aot:
    name: Release-built NativeAOT CLI (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2025
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang file zlib1g-dev
      - name: Install deterministic archive prerequisite on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install gnu-tar
      - name: Provision exact jq source and official oracle
        shell: bash
        run: >-
          bash tools/release/provision-jq-1.8.2-test-assets.sh
          --rid '${{ matrix.rid }}'
          --destination "$GITHUB_WORKSPACE/artifacts/test-assets/jq-1.8.2"
          --github-env "$GITHUB_ENV"
      - name: Build and validate the release-format NativeAOT archive
        shell: bash
        run: >-
          bash tools/release/build-native-archive.sh
          --rid '${{ matrix.rid }}'
          --version "$CI_VERSION"
          --output-directory artifacts/release
          --execute-validation
      - name: Extract Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p 'artifacts/smoke/${{ matrix.rid }}'
          tar -xzf 'artifacts/release/dotnetjq-${{ env.CI_VERSION }}-${{ matrix.rid }}.tar.gz' \
            -C 'artifacts/smoke/${{ matrix.rid }}'
          printf 'DOTNETJQ_CLI=%s\n' \
            "$PWD/artifacts/smoke/${{ matrix.rid }}/dotnetjq" >>"$GITHUB_ENV"
      - name: Extract Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = 'artifacts/smoke/${{ matrix.rid }}'
          Expand-Archive 'artifacts/release/dotnetjq-${{ env.CI_VERSION }}-${{ matrix.rid }}.zip' $destination
          $subject = (Resolve-Path "$destination/dotnetjq.exe").Path
          "DOTNETJQ_CLI=$subject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the complete strict process suite against the release executable
        shell: bash
        run: |
          dotnet restore "$CLI_TEST_PROJECT"
          mkdir -p artifacts/test-results
          dotnet test "$CLI_TEST_PROJECT" \
            --configuration Release --no-restore \
            --results-directory artifacts/test-results \
            --logger 'trx;LogFileName=native-${{ matrix.rid }}.trx'
          python tools/release/verify-trx-no-skips.py \
            'artifacts/test-results/native-${{ matrix.rid }}.trx'
      - name: Verify Unix shell and byte contract
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/cli-shell/verify.sh "$DOTNETJQ_CLI" "$CI_VERSION"
      - name: Verify Windows executable in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./tests/powershell/Verify-DotNetJq.ps1
          -CliPath $env:DOTNETJQ_CLI
          -ExpectedShell PowerShell7
          -ExpectedVersion $env:CI_VERSION
      - name: Verify Windows executable in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & powershell.exe
          -NoLogo
          -NoProfile
          -NonInteractive
          -ExecutionPolicy Bypass
          -File tests/powershell/Verify-DotNetJq.ps1
          -CliPath $env:DOTNETJQ_CLI
          -ExpectedShell WindowsPowerShell51
          -ExpectedVersion $env:CI_VERSION
      - name: Upload verified release-format archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-native-${{ matrix.rid }}
          path: artifacts/release/dotnetjq-*
          if-no-files-found: error
          retention-days: 7

  native-aot-musl:
    name: Release-built NativeAOT CLI (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            os: ubuntu-24.04
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Provision exact jq source and static official oracle
        shell: bash
        run: >-
          bash tools/release/provision-jq-1.8.2-test-assets.sh
          --rid '${{ matrix.rid }}'
          --destination "$GITHUB_WORKSPACE/artifacts/test-assets/jq-1.8.2"
      - name: Build and validate release archive in the matching Alpine SDK
        shell: bash
        run: |
          mkdir -p artifacts/release
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            "$ALPINE_AOT_SDK_IMAGE" \
            sh -c "apk add --no-cache bash file icu-libs python3 tar >/dev/null && bash tools/release/build-native-archive.sh --rid '${{ matrix.rid }}' --version '$CI_VERSION' --output-directory artifacts/release --execute-validation"
      - name: Extract the release-built executable
        shell: bash
        run: |
          mkdir -p 'artifacts/smoke/${{ matrix.rid }}'
          tar -xzf 'artifacts/release/dotnetjq-${{ env.CI_VERSION }}-${{ matrix.rid }}.tar.gz' \
            -C 'artifacts/smoke/${{ matrix.rid }}'
      - name: Verify executable in the minimal pinned Alpine runtime image
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            "$ALPINE_RUNTIME_DEPS_IMAGE" \
            sh -c 'apk add --no-cache icu-libs >/dev/null && sh tests/cli-shell/verify.sh "/repo/artifacts/smoke/${{ matrix.rid }}/dotnetjq" "${{ env.CI_VERSION }}"'
      - name: Run the complete strict process suite in Alpine
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            --env DOTNETJQ_REQUIRE_FULL_COMPATIBILITY=1 \
            --env DOTNETJQ_JQ182=/repo/artifacts/test-assets/jq-1.8.2/oracle/jq \
            --env DOTNETJQ_ORACLE=/repo/artifacts/test-assets/jq-1.8.2/oracle/jq \
            --env DOTNETJQ_UPSTREAM=/repo/artifacts/test-assets/jq-1.8.2/upstream \
            --env DOTNETJQ_CLI='/repo/artifacts/smoke/${{ matrix.rid }}/dotnetjq' \
            "$ALPINE_AOT_SDK_IMAGE" \
            sh -c "apk add --no-cache icu-libs >/dev/null && dotnet test '$CLI_TEST_PROJECT' --configuration Release --results-directory artifacts/test-results --logger 'trx;LogFileName=native-${{ matrix.rid }}.trx'"
          python tools/release/verify-trx-no-skips.py \
            'artifacts/test-results/native-${{ matrix.rid }}.trx'
      - name: Upload verified release-format archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-native-${{ matrix.rid }}
          path: artifacts/release/dotnetjq-*
          if-no-files-found: error
          retention-days: 7
