name: Feature request
description: Propose a managed API, tooling, documentation, or distribution improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Does this alter jq-compatible behavior?
      options:
        - No
        - Yes
        - Unsure
    validations:
      required: true
